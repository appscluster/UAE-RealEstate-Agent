services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "54231:54231"
    environment:
      DEMO_TENANT: tenant_sandstone
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:20128/v1}
      LLM_MODEL: ${LLM_MODEL:-auto/chat}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/var:/app/backend/var
      - ./data:/app/data:ro
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "43231:43231"
    depends_on:
      - backend
